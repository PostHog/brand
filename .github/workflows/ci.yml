name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate components from the committed catalog
        run: pnpm codegen

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate package exports
        run: |
          pnpm exec publint
          pnpm exec attw --pack . --profile esm-only

      - name: Size report
        run: pnpm -s size >> "$GITHUB_STEP_SUMMARY"

      # The demo site is only otherwise built by Cloudflare Pages, i.e. after merge — build
      # it here so a broken site is caught on the PR instead of in production.
      - name: Build site
        run: pnpm --filter @posthog/brand-site build

      # `@posthog/brand` is a workspace symlink, so its bare `react` imports can resolve to a
      # second React outside site/node_modules and blank every route that uses a hook (#23).
      # One copy in the bundle == one React instance; see site/vite.config.ts `resolve.dedupe`.
      - name: Assert a single React copy in the site bundle
        run: |
          marker='__CLIENT_INTERNALS_DO_NOT_USE_OR_WARN_USERS_THEY_CANNOT_UPGRADE='
          copies=$(grep -roF "$marker" site/dist/assets --include='*.js' | wc -l | tr -d ' ')
          if [ "$copies" != "1" ]; then
            echo "::error::Expected exactly 1 React copy in the site bundle, found $copies."
            exit 1
          fi
