name: Deploy the image render Worker

# The render Worker (edge/src/render-worker.ts, edge/wrangler.jsonc) deploys on its own: the site
# and its render page deploy with Cloudflare Pages. Needs the CLOUDFLARE_API_TOKEN (Workers Scripts
# edit) and CLOUDFLARE_ACCOUNT_ID secrets; without them this skips with a notice.

on:
  push:
    branches: [main]
    paths:
      - "edge/**"
      - "site/src/image-maker/catalog.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN isn't set, so the render Worker wasn't deployed."

      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm --filter @posthog/brand-edge deploy:render
